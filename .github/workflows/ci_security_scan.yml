# AutoMarkov – secret scan + push protection
name: ci_security_scan

on:
  push:
  pull_request:

# Least privilege — only need to read code and (for push) write to check runs
permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0  # full history for secret scanning
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push protection: block push if gitleaks detected secrets
  push-protection:
    if: ${{ github.event_name == 'push' }}
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce push protection
        run: |
          status="${{ needs.gitleaks.result }}"
          if [ "$status" != "success" ]; then
            echo "::error::Push blocked — gitleaks detected secrets ($status). See gitleaks job output."
            exit 1
          fi
          echo "Push clean — no secrets detected."
