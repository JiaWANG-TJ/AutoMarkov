[project]
name = "automarkov-profile-env-citylearn"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "citylearn==2.5.0",
  "gymnasium==0.28.1",
  "numpy==1.26.4",
  "setuptools==84.0.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0"]
no-build-isolation-package = ["tinynumpy"]
required-version = "==0.11.16"
