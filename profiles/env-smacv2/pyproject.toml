[project]
name = "automarkov-profile-env-smacv2"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "protobuf==3.20.1",
  "pysc2==4.0.0",
  "smacv2 @ git+https://github.com/oxwhirl/smacv2@577ab5a2cff2391f8df582da5731ea9cd6adf3c6",
  "setuptools==84.0.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0"]
no-build-isolation-package = ["mpyq", "s2protocol", "smacv2"]
required-version = "==0.11.16"
