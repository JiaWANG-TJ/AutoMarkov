[project]
name = "automarkov-profile-authoring"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "camel-ai==0.2.90",
  "pydantic==2.12.0",
  "httpx==0.28.1",
  "sentence-transformers==5.7.0",
  "lancedb==0.36.0",
  "setuptools==84.0.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0"]
no-build-isolation-package = ["google-search-results"]
required-version = "==0.11.16"
