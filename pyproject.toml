[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "automarkov"
version = "0.1.0"
description = "A provenance-first compiler for sequential decision processes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jia Wang", email = "jiawang@tongji.edu.cn" }]
keywords = [
  "automarkov",
  "mdp",
  "pomdp",
  "reinforcement-learning",
  "sequential decision",
  "decision process",
  "provenance",
  "compiler",
  "abm",
  "multi-agent",
  "rl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "cryptography==49.0.0",
  "httpx>=0.28.1",
  "jsonschema==4.26.0",
  "numpy>=2.3.5",
  "packaging==26.3",
  "pydantic==2.12.0",
  "rfc8785==0.1.4",
  "typing-extensions==4.16.0",
]

[project.urls]
Homepage = "https://github.com/AutoMarkov/AutoMarkov"
Repository = "https://github.com/AutoMarkov/AutoMarkov"
Documentation = "https://github.com/AutoMarkov/AutoMarkov#readme"
"Bug Tracker" = "https://github.com/AutoMarkov/AutoMarkov/issues"
Changelog = "https://github.com/AutoMarkov/AutoMarkov/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
  "vllm>=0.8.0",
  "transformers>=4.45.0",
]
training = [
  "torch>=2.0.0",
  "gymnasium>=0.29.0",
  "pettingzoo>=1.24.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
docs = [
  "mkdocs>=1.6.0",
]
security = [
  "bandit>=1.7.0",
  "safety>=2.3.0",
]

[project.scripts]
automarkov = "automarkov.cli.main:main"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==8.4.2",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automarkov"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
lint.extend-ignore = ["E902"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
